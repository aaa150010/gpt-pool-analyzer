services:
  gpt-analyzer:
    build: .
    container_name: gpt-analyzer-server
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      POLL_INTERVAL_SECONDS: "300"
      PIXEL_MANAGER_CONFIG_PATH: "/data/pixel_manager.json"
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8095:8095"
    networks:
      - default
      - note_default

networks:
  note_default:
    external: true
