name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build app
        shell: bash
        run: ./build.sh

      - name: Verify release package
        shell: bash
        run: |
          mkdir -p build/verify
          ditto -x -k dist/91.zip build/verify
          test -d build/verify/91.app
          lipo -archs build/verify/91.app/Contents/MacOS/gpt-analyzer | grep -Eq '^(arm64|x86_64)$'
          codesign --verify --deep --strict build/verify/91.app
